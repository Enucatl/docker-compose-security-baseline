name: Docker CI

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      version:
        required: false
        type: string
        default: ""
      meta_tags:
        required: false
        type: string
        default: ""
      context:
        required: false
        type: string
        default: .
      dockerfile:
        required: false
        type: string
        default: Dockerfile
      platforms:
        required: false
        type: string
        default: linux/amd64
      target:
        required: false
        type: string
        default: ""
      build_args:
        required: false
        type: string
        default: ""
      cache:
        required: false
        type: boolean
        default: true
      cache_scope:
        required: false
        type: string
        default: ""
      set_meta_labels:
        required: false
        type: boolean
        default: true
      push:
        required: false
        type: boolean
        default: false
      trivy_severity:
        required: false
        type: string
        default: HIGH,CRITICAL
      trivy_skip_dirs:
        required: false
        type: string
        default: ""
      fail_on_image_findings:
        required: false
        type: boolean
        default: true
      fail_on_fs_findings:
        required: false
        type: boolean
        default: true
    secrets:
      registry_token:
        description: "GitHub token used to authenticate against GHCR"
        required: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tags.outputs.version }}
      meta_tags: ${{ steps.tags.outputs.meta_tags }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute git version
        id: version
        uses: Enucatl/docker-compose-security-baseline/.github/actions/git-version@main

      - name: Compute Docker tags from git
        id: tags
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_META_TAGS: ${{ inputs.meta_tags }}
        run: |
          set -euo pipefail

          # By default, publish the git-derived version
          # <base-tag>.<commits-since-base-tag>-g<short-sha>, plus cumulative
          # base-tag prefixes. For example, base tag 1.2.3 and two additional
          # commits at abc123 produce 1.2.3.2-gabc123, 1, 1.2, and 1.2.3;
          # main also gets latest, and branch/tag refs get their ref name.
          # Callers can replace this complete tag set by passing version and
          # meta_tags together.
          # The workflow publishes tags from meta_tags but scans image_name:version later,
          # so caller-controlled overrides must provide both values together.
          if [[ -n "${INPUT_VERSION}" && -z "${INPUT_META_TAGS}" ]]; then
            echo "inputs.version requires inputs.meta_tags" >&2
            exit 1
          fi

          if [[ -z "${INPUT_VERSION}" && -n "${INPUT_META_TAGS}" ]]; then
            echo "inputs.meta_tags requires inputs.version" >&2
            exit 1
          fi

          if [[ -n "${INPUT_VERSION}" ]]; then
            version="${INPUT_VERSION}"
          else
            version="${{ steps.version.outputs.version }}"
          fi

          if [[ -n "${INPUT_META_TAGS}" ]]; then
            {
              echo "version=${version}"
              echo "meta_tags<<EOF"
              printf '%s\n' "${INPUT_META_TAGS}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_tag="${{ steps.version.outputs.base_tag }}"

          partials=()
          IFS='.' read -ra parts <<< "$base_tag"
          accum=""
          for part in "${parts[@]}"; do
            accum="${accum:+$accum.}$part"
            partials+=("$accum")
          done

          {
            echo "version=$version"
            echo "meta_tags<<EOF"
            echo "type=raw,value=${version}"
            if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
              echo "type=raw,value=latest"
            fi
            if [[ "${GITHUB_REF}" == refs/heads/* ]]; then
              echo "type=ref,event=branch"
            elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              echo "type=ref,event=tag"
            fi
            for partial in "${partials[@]}"; do
              echo "type=raw,value=${partial}"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: ${{ inputs.push }}
      context: ${{ inputs.context }}
      file: ${{ inputs.dockerfile }}
      platforms: ${{ inputs.platforms }}
      target: ${{ inputs.target }}
      build-args: ${{ inputs.build_args }}
      cache: ${{ inputs.cache }}
      cache-scope: ${{ inputs.cache_scope }}
      meta-images: ${{ inputs.image_name }}
      meta-tags: ${{ needs.meta.outputs.meta_tags }}
      set-meta-labels: ${{ inputs.set_meta_labels }}
      sbom: true
      sign: auto
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.registry_token || github.token }}

  scan:
    needs:
      - meta
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      # Jobs run on separate runners, so scan must check out the caller's
      # repository again for the filesystem scan. Git history is not needed;
      # one commit is sufficient and avoids downloading the full repository.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Scan filesystem with Trivy
        id: fs_table
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: latest
          scan-type: fs
          scan-ref: ${{ inputs.context }}
          format: table
          exit-code: "1"
          scanners: misconfig,secret
          severity: ${{ inputs.trivy_severity }}
          skip-dirs: ${{ inputs.trivy_skip_dirs }}

      - name: Write filesystem SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: latest
          scan-type: fs
          scan-ref: ${{ inputs.context }}
          format: sarif
          output: trivy-fs.sarif
          exit-code: "0"
          scanners: misconfig,secret
          severity: ${{ inputs.trivy_severity }}
          skip-dirs: ${{ inputs.trivy_skip_dirs }}

      - name: Scan published image with Trivy
        id: image_table
        if: ${{ inputs.push }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.registry_token || github.token }}
        with:
          version: latest
          image-ref: ${{ inputs.image_name }}:${{ needs.meta.outputs.version }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln,secret
          severity: ${{ inputs.trivy_severity }}

      - name: Write image SARIF
        if: ${{ inputs.push }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.registry_token || github.token }}
        with:
          version: latest
          image-ref: ${{ inputs.image_name }}:${{ needs.meta.outputs.version }}
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln,secret
          severity: ${{ inputs.trivy_severity }}

      - name: Write image Trivy JSON
        if: ${{ inputs.push }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.registry_token || github.token }}
        with:
          version: latest
          image-ref: ${{ inputs.image_name }}:${{ needs.meta.outputs.version }}
          format: json
          output: trivy-image-raw.json
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln
          severity: ${{ inputs.trivy_severity }}

      - name: Project remediation report
        if: ${{ inputs.push && hashFiles('trivy-image-raw.json') != '' }}
        uses: Enucatl/docker-compose-security-baseline/.github/actions/trivy-remediation@main
        with:
          command: validate-report.py
          args: trivy-image-raw.json trivy-image.json trivy-finding-markers

      - name: Record image policy result
        if: ${{ always() && inputs.push }}
        env:
          IMAGE_TABLE_OUTCOME: ${{ steps.image_table.outcome }}
          FAIL_ON_IMAGE_FINDINGS: ${{ inputs.fail_on_image_findings }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${FAIL_ON_IMAGE_FINDINGS}" == "true" && "${IMAGE_TABLE_OUTCOME}" == "failure" ]]; then
            echo true > trivy-image-policy-failed
          else
            echo false > trivy-image-policy-failed
          fi

      - name: Upload image Trivy report
        if: ${{ always() && inputs.push && hashFiles('trivy-image.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: trivy-image-report
          path: |
            trivy-image.json
            trivy-image-policy-failed
            trivy-finding-markers
          if-no-files-found: error

      - name: Upload filesystem Trivy SARIF
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Upload image Trivy SARIF
        if: always() && inputs.push && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Enforce filesystem scan policy
        if: ${{ inputs.fail_on_fs_findings && steps.fs_table.outcome == 'failure' }}
        shell: bash
        run: exit 1

      - name: Enforce image scan policy
        if: ${{ inputs.push && inputs.fail_on_image_findings && steps.image_table.outcome == 'failure' }}
        shell: bash
        run: exit 1
